<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml"
    xmlns:o="urn:schemas-microsoft-com:office:office">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="supported-color-schemes" content="light" />
    <title>Printomation</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@600;700;800&display=swap"
        rel="stylesheet" />
    <!--[if mso]>
    <noscript>
        <xml>
            <o:OfficeDocumentSettings>
                <o:PixelsPerInch>96</o:PixelsPerInch>
            </o:OfficeDocumentSettings>
        </xml>
    </noscript>
    <style>
        table, td { font-family: Arial, sans-serif !important; }
    </style>
    <![endif]-->
    <style>
        /* ============================================================
           PRINTOMATION EMAIL THEME - MODERN LIGHT SAAS
           Brand colors (matching website):
             Page background:                 #F8FAFC
             Card background:                 #FFFFFF
             Card border:                     #E2E8F0
             Primary Brand Accent:            #2563EB
             Primary Deep Text:               #0F172A
             Body text:                       #334155
             Muted text:                      #64748B
             Light badge bg:                  #EFF6FF
             Light badge text:                #1D4ED8
             Light badge border:              #DBEAFE
             Footer bg:                       #F8FAFC
             Footer border:                   #E2E8F0
             Footer text:                     #64748B
             Footer link:                     #2563EB
             Copyright text:                  #94A3B8
           ============================================================ */
        body,
        table,
        td,
        a {
            -webkit-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
        }

        table,
        td {
            mso-table-lspace: 0pt;
            mso-table-rspace: 0pt;
        }

        img {
            -ms-interpolation-mode: bicubic;
            border: 0;
            outline: none;
            text-decoration: none;
            display: block;
        }

        body {
            margin: 0;
            padding: 0;
            width: 100% !important;
            height: 100% !important;
            background-color: #F8FAFC;
        }

        /* Typography defaults for injected {{CONTENT_PLACED_HERE}} */
        .content h1 {
            margin: 0 0 10px;
            font-family: 'Montserrat', 'Inter', Arial, sans-serif;
            font-size: 22px;
            line-height: 1.3;
            font-weight: 800;
            color: #0F172A;
        }

        .content h2 {
            margin: 20px 0 8px;
            font-family: 'Montserrat', 'Inter', Arial, sans-serif;
            font-size: 18px;
            line-height: 1.35;
            font-weight: 700;
            color: #0F172A;
        }

        .content p {
            margin: 0 0 14px;
            font-family: 'Inter', Arial, sans-serif;
            font-size: 14px;
            line-height: 1.6;
            color: #334155;
        }

        .content a {
            color: #2563EB;
            text-decoration: underline;
            font-weight: 600;
        }

        .content ul,
        .content ol {
            margin: 0 0 14px;
            padding-left: 18px;
        }

        .content li {
            font-family: 'Inter', Arial, sans-serif;
            font-size: 13.5px;
            line-height: 1.6;
            color: #334155;
            margin-bottom: 5px;
        }

        .badge {
            display: inline-block;
            font-family: 'Inter', Arial, sans-serif;
            font-size: 11px;
            font-weight: 600;
            color: #1D4ED8;
            background-color: #EFF6FF;
            padding: 5px 13px;
            border-radius: 9999px;
            letter-spacing: .2px;
            border: 1px solid #DBEAFE;
        }

        .divider {
            border-top: 1px solid #F1F5F9;
            font-size: 0;
            line-height: 0;
        }

        @media only screen and (max-width: 680px) {
            .email-wrapper {
                width: 100% !important;
                max-width: 100% !important;
            }

            .stack-col {
                display: block !important;
                width: 100% !important;
                text-align: left !important;
            }

            .fluid-pad {
                padding-left: 18px !important;
                padding-right: 18px !important;
            }

            .footer-col {
                display: block !important;
                width: 100% !important;
                text-align: left !important;
                padding: 0 0 16px 0 !important;
            }
        }
    </style>
</head>

<body style="margin:0; padding:0; background-color:#F8FAFC;">
    <!-- Preheader (hidden preview text) -->
    <div
        style="display:none; max-height:0; overflow:hidden; mso-hide:all; font-size:1px; line-height:1px; color:#F8FAFC;">
        {{PREHEADER_TEXT}}
    </div>

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#F8FAFC;">
        <tr>
            <td align="center" style="padding:24px 10px;">

                <!-- ===================== MODERN LIGHT CARD (640px) ===================== -->
                <table role="presentation" class="email-wrapper" width="640" cellpadding="0" cellspacing="0"
                    style="width:640px; max-width:640px; background-color:#ffffff; border:1px solid #E2E8F0; border-radius:16px; overflow:hidden; box-shadow:0 6px 24px rgba(15,23,42,0.06);">

                    <!-- TOP ACCENT LINE -->
                    <tr>
                        <td style="height:3px; background-color:#2563EB; font-size:0; line-height:0;">&nbsp;</td>
                    </tr>

                    <!-- HEADER -->
                    <tr>
                        <td style="background-color:#ffffff; padding:18px 26px; border-bottom:1px solid #F1F5F9;">
                            <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                                <tr>
                                    <td class="stack-col" align="left" style="vertical-align:middle;">
                                        <img src="{{LOGO_URL}}" alt="Printomation" width="160" height="44"
                                            style="height:44px; width:auto; max-height:46px; max-width:175px; display:block; border:0; outline:none;"
                                            border="0" />
                                    </td>
                                    <td class="stack-col" align="right" style="vertical-align:middle; padding-top:4px;">
                                        <span class="badge">{{BADGE_TEXT}}</span>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- CONTENT -->
                    <tr>
                        <td class="fluid-pad content" style="padding:28px 28px 18px 28px; background-color:#ffffff;">
                            {{CONTENT_PLACED_HERE}}
                        </td>
                    </tr>

                    <tr>
                        <td class="fluid-pad" style="padding:0 28px 14px;">
                            <div class="divider">&nbsp;</div>
                        </td>
                    </tr>

                    <!-- FOOTER (LIGHT THEME) -->
                    <tr>
                        <td style="background-color:#F8FAFC; padding:22px 26px; border-top:1px solid #E2E8F0;">
                            <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                                <tr>
                                    <td class="footer-col" style="vertical-align:top;">
                                        <img src="{{LOGO_URL}}" alt="Printomation" width="135" height="37"
                                            style="height:37px; width:auto; max-height:40px; max-width:145px; display:block; border:0; outline:none; margin-bottom:8px;"
                                            border="0" />
                                        <p
                                            style="margin:0; font-family:'Inter',Arial,sans-serif; font-size:11.5px; line-height:1.55; color:#64748B; max-width:280px;">
                                            {{FOOTER_DESC}}
                                        </p>
                                    </td>
                                    <td class="footer-col" align="right" style="vertical-align:top;">
                                        <p
                                            style="margin:0 0 6px; font-family:'Inter',Arial,sans-serif; font-size:12px; line-height:1.5; color:#334155; font-weight:600;">
                                            Support &amp; Inquiries:
                                        </p>
                                        <p
                                            style="margin:0; font-family:'Inter',Arial,sans-serif; font-size:12px; line-height:1.5;">
                                            <a href="mailto:info@gravurtastisch.de"
                                                style="color:#2563EB; text-decoration:none; font-weight:600;">info@gravurtastisch.de</a>
                                        </p>
                                    </td>
                                </tr>
                            </table>

                            <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                                style="margin-top:16px;">
                                <tr>
                                    <td style="border-top:1px solid #E2E8F0; padding-top:12px;">
                                        <p
                                            style="margin:0; font-family:'Inter',Arial,sans-serif; font-size:11px; line-height:1.5; color:#94A3B8;">
                                            {{COPYRIGHT_TEXT}}
                                        </p>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                </table>
                <!-- ===================== /MODERN LIGHT CARD ===================== -->

                <!-- Sub-footer -->
                <table role="presentation" class="email-wrapper" width="640" cellpadding="0" cellspacing="0"
                    style="width:640px; max-width:640px;">
                    <tr>
                        <td align="center" style="padding:12px 14px 0;">
                            <p
                                style="margin:0; font-family:'Inter',Arial,sans-serif; font-size:11px; line-height:1.5; color:#94A3B8;">
                                {{SUBFOOTER_TEXT}}
                            </p>
                        </td>
                    </tr>
                </table>

            </td>
        </tr>
    </table>
</body>

</html>
