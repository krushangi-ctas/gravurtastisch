<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad_photo_dpi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0b1f" />
      <stop offset="100%" stop-color="#2e1065" />
    </linearGradient>
    <pattern id="grid_photo_dpi" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
    </pattern>
    <filter id="glow_photo_dpi" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Solid Gradient Background -->
  <rect width="1200" height="675" fill="url(#bgGrad_photo_dpi)" />
  <rect width="1200" height="675" fill="url(#grid_photo_dpi)" />

  <!-- Ambient Glowing Orbs -->
  <circle cx="220" cy="160" r="240" fill="#8b5cf6" opacity="0.14" filter="url(#glow_photo_dpi)" />
  <circle cx="1000" cy="480" r="280" fill="#8b5cf6" opacity="0.12" filter="url(#glow_photo_dpi)" />

  <!-- Outer Glass Frame -->
  <rect x="50" y="45" width="1100" height="585" rx="24" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />

  <!-- Window Header Bar -->
  <g transform="translate(85, 75)">
    <circle cx="12" cy="12" r="6" fill="#ef4444" opacity="0.85" />
    <circle cx="32" cy="12" r="6" fill="#f59e0b" opacity="0.85" />
    <circle cx="52" cy="12" r="6" fill="#10b981" opacity="0.85" />
    <text x="75" y="17" fill="rgba(255,255,255,0.45)" font-family="monospace" font-size="12" font-weight="600">PRINTOMATION // CAD &amp; SP-API PIPELINE // PHOTO_DPI</text>
  </g>

  <!-- Tag Pill -->
  <g transform="translate(85, 125)">
    <rect width="260" height="36" rx="18" fill="rgba(255,255,255,0.08)" stroke="#a78bfa" stroke-width="1.5" />
    <circle cx="20" cy="18" r="4.5" fill="#a78bfa" />
    <text x="36" y="23" fill="#a78bfa" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1">HIGH-RES PRE-FLIGHT</text>
  </g>

  <!-- Main Title -->
  <g transform="translate(85, 225)">
    <text x="0" y="0" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5">
      <tspan x="0" dy="0">Buyer Photo Uploads</tspan>
      <tspan x="0" dy="50" fill="#a78bfa">Automated DPI &amp; Background Prep</tspan>
    </text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(85, 360)">
    <text x="0" y="0" fill="rgba(255,255,255,0.78)" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400">
      300+ DPI automatic vectorization and transparent background masking
    </text>
  </g>

  <!-- Badges in Footer of Banner -->
  <g transform="translate(85, 475)">
    <rect x="0" y="0" width="180" height="44" rx="10" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.18)" />
    <text x="90" y="27" fill="#f1f5f9" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">300+ DPI Auto-Scale</text>

    <rect x="195" y="0" width="190" height="44" rx="10" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.18)" />
    <text x="290" y="27" fill="#f1f5f9" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">Official SP-API</text>

    <rect x="400" y="0" width="180" height="44" rx="10" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.18)" />
    <text x="490" y="27" fill="#f1f5f9" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">&lt; 10s Automated</text>
  </g>

  <!-- Right Side Interactive Graphic / Machine HUD -->
  <g transform="translate(730, 140)">
    <!-- Tech HUD Container -->
    <rect width="370" height="370" rx="20" fill="rgba(3, 7, 18, 0.85)" stroke="#a78bfa" stroke-width="1.5" />
    
    <!-- Coordinate Target Circle -->
    <circle cx="185" cy="170" r="130" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <circle cx="185" cy="170" r="90" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1" stroke-dasharray="4 4" />
    <circle cx="185" cy="170" r="50" fill="none" stroke="#a78bfa" stroke-width="1.5" opacity="0.35" />

    <!-- Specific Visual Elements per Topic -->
    
      <!-- Photo frame with resolution grid -->
      <rect x="70" y="75" width="220" height="150" rx="12" fill="rgba(255,255,255,0.05)" stroke="#a78bfa" stroke-width="2" />
      <!-- Mountain and sun graphic -->
      <circle cx="120" cy="120" r="16" fill="#a78bfa" opacity="0.8" />
      <polygon points="90,195 150,135 190,175 220,150 260,195" fill="rgba(255,255,255,0.2)" stroke="#a78bfa" stroke-width="1.5" />
      <!-- DPI badge -->
      <rect x="195" y="90" width="80" height="26" rx="6" fill="#10b981" />
      <text x="235" y="107" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">300 DPI OK</text>
    

    <!-- Bottom HUD Spec Pill -->
    <rect x="25" y="305" width="320" height="40" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" />
    <text x="185" y="330" fill="#ffffff" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">RASTER PRE-FLIGHT MESH</text>
  </g>
</svg>