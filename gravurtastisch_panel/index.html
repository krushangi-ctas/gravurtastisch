  <!-- Gravurtastisch Splash Screen CSS -->
  <style>
    body #fuse-splash-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ffffff;
      color: #1e293b;
      z-index: 999999;
      pointer-events: none;
      opacity: 1;
      visibility: visible;
      transition: opacity 400ms cubic-bezier(0.4, 0, 0.2, 1);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
    }

    .splash-logo-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: splash-float 2.8s ease-in-out infinite;
    }

    .splash-logo-glow {
      position: absolute;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 50, 171, 0.18) 0%, rgba(255, 255, 255, 0) 70%);
      animation: splash-pulse 2.2s ease-in-out infinite;
      z-index: 1;
    }

    .splash-logo {
      position: relative;
      width: 200px;
      max-width: 80vw;
      height: auto;
      object-fit: contain;
      z-index: 2;
    }

    .splash-progress-track {
      width: 130px;
      height: 4px;
      background-color: #f1f5f9;
      border-radius: 9999px;
      overflow: hidden;
      position: relative;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.04);
    }

    .splash-progress-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 45%;
      background: linear-gradient(90deg, #0032ab 0%, #155dfc 100%);
      border-radius: 9999px;
      animation: splash-slide 1.4s cubic-bezier(0.45, 0, 0.55, 1) infinite;
    }

    @keyframes splash-float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-4px);
      }
    }

    @keyframes splash-pulse {
      0%, 100% {
        transform: scale(0.9);
        opacity: 0.6;
      }
      50% {
        transform: scale(1.15);
        opacity: 1;
      }
    }

    @keyframes splash-slide {
      0% {
        left: -45%;
      }
      100% {
        left: 100%;
      }
    }
  </style>
  <!-- / Gravurtastisch Splash Screen CSS -->
</head>

<body id="root">
  <div id="app" class="flex">
    <!-- Printomation Splash Screen -->
    <div id="fuse-splash-screen">
      <div class="splash-container">
        <div class="splash-logo-wrapper">
          <div class="splash-logo-glow"></div>
          <svg width="220" height="48" viewBox="0 0 220 48" fill="none" xmlns="http://www.w3.org/2000/svg" class="splash-logo">
            <defs>
              <linearGradient id="splash-border-grad" x1="0" y1="0" x2="44" y2="44" gradientUnits="userSpaceOnUse">
                <stop stop-color="#0032ab"/>
                <stop offset="0.5" stop-color="#2032b5"/>
                <stop offset="1" stop-color="#2563eb"/>
              </linearGradient>
              <linearGradient id="splash-bg-grad" x1="0" y1="0" x2="44" y2="44" gradientUnits="userSpaceOnUse">
                <stop stop-color="#002888"/>
                <stop offset="1" stop-color="#001858"/>
              </linearGradient>
              <linearGradient id="splash-p-grad" x1="12" y1="6" x2="36" y2="38" gradientUnits="userSpaceOnUse">
                <stop stop-color="#ffffff"/>
                <stop offset="0.6" stop-color="#e0f2fe"/>
                <stop offset="1" stop-color="#bae6fd"/>
              </linearGradient>
              <linearGradient id="splash-text-grad" x1="100" y1="0" x2="200" y2="0" gradientUnits="userSpaceOnUse">
                <stop stop-color="#2563eb"/>
                <stop offset="0.5" stop-color="#4f6ef7"/>
                <stop offset="1" stop-color="#7c3aed"/>
              </linearGradient>
            </defs>
            <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#splash-border-grad)"/>
            <rect x="3.5" y="3.5" width="41" height="41" rx="10.5" fill="url(#splash-bg-grad)"/>
            <circle cx="36" cy="10" r="5" fill="#38bdf8" opacity="0.6"/>
            <path
              fill-rule="evenodd"
              clip-rule="evenodd"
              d="M14 9C14 7.9 14.9 7 16 7H26C31.52 7 36 11.48 36 17C36 22.52 31.52 27 26 27H19V38C19 39.1 18.1 40 17 40H16C14.9 40 14 39.1 14 38V9ZM19 12V22H26C28.76 22 31 19.76 31 17C31 14.24 28.76 12 26 12H19Z"
              fill="url(#splash-p-grad)"
            />
            <text x="58" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="26" letter-spacing="-0.03em" fill="#0f172a">Print<tspan fill="url(#splash-text-grad)">omation</tspan></text>
          </svg>
        </div>
        <div class="splash-progress-track">
          <div class="splash-progress-bar"></div>
        </div>
      </div>
    </div>
    <!-- / Printomation Splash Screen -->
