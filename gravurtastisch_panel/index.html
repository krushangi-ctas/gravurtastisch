  <!-- Gravurtastisch Splash Screen CSS -->
  <style>
    body #fuse-splash-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ffffff;
      color: #1e293b;
      z-index: 999999;
      pointer-events: none;
      opacity: 1;
      visibility: visible;
      transition: opacity 400ms cubic-bezier(0.4, 0, 0.2, 1);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
    }

    .splash-logo-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: splash-float 2.8s ease-in-out infinite;
    }

    .splash-logo-glow {
      position: absolute;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(97, 62, 163, 0.22) 0%, rgba(255, 255, 255, 0) 70%);
      animation: splash-pulse 2.2s ease-in-out infinite;
      z-index: 1;
    }

    .splash-logo {
      position: relative;
      width: 200px;
      max-width: 80vw;
      height: auto;
      object-fit: contain;
      z-index: 2;
    }

    .splash-progress-track {
      width: 130px;
      height: 4px;
      background-color: #f1f5f9;
      border-radius: 9999px;
      overflow: hidden;
      position: relative;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.04);
    }

    .splash-progress-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 45%;
      background: linear-gradient(90deg, #613EA3 0%, #E89B5C 100%);
      border-radius: 9999px;
      animation: splash-slide 1.4s cubic-bezier(0.45, 0, 0.55, 1) infinite;
    }

    @keyframes splash-float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-4px);
      }
    }

    @keyframes splash-pulse {
      0%, 100% {
        transform: scale(0.9);
        opacity: 0.6;
      }
      50% {
        transform: scale(1.15);
        opacity: 1;
      }
    }

    @keyframes splash-slide {
      0% {
        left: -45%;
      }
      100% {
        left: 100%;
      }
    }
  </style>
  <!-- / Gravurtastisch Splash Screen CSS -->
</head>

<body id="root">
  <div id="app" class="flex">
    <!-- Gravurtastisch Splash Screen -->
    <div id="fuse-splash-screen">
      <div class="splash-container">
        <div class="splash-logo-wrapper">
          <div class="splash-logo-glow"></div>
          <img class="splash-logo" src="/assets/images/logo/gravurstastich-wordmark.svg" alt="Gravurtastisch" />
        </div>
        <div class="splash-progress-track">
          <div class="splash-progress-bar"></div>
        </div>
      </div>
    </div>
    <!-- / Gravurtastisch Splash Screen -->
  </div>
