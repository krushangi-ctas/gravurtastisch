# Rollen (02.10.2026): gravur + entwickler = voller Zugriff, zuschauer = nur ansehen.
# Zuschauer darf alles laden (GET/HEAD), aber nichts schreiben. /start-cron ist ein GET
# mit Wirkung (startet den Amazon-Abruf) und ist deshalb extra gesperrt.
map "$remote_user:$request_method:$uri" $zuschauer_gesperrt {
    default 0;
    "~^zuschauer:(?!GET:|HEAD:)"     1;
    "~^zuschauer:[A-Z]+:/start-cron" 1;
}

# Freelancer (21.10.2026): sieht NUR den Amazon-Bereich (eigene Startseite /amazon-bereich/start.html).
# Alles andere — Editor, Bestellungen, Kundenfotos in den Tagesordnern — ist für ihn gesperrt. $uri ist
# normalisiert (../ aufgelöst), Umwege über Pfade gibt es also nicht. Rechte innerhalb des Bereichs
# (keine Kosten, kein Abruf, nur eigene Experimente ändern) regelt amazon-bereich/server/verkaeufe.js.
map "$remote_user:$uri" $freelancer_gesperrt {
    default 0;
    "~^freelancer:/(amazon-bereich/|amazon/verkaeufe/|vendor/fonts/|layout-editor\.css$|wer-bin-ich$|abgemeldet\.html$|$)" 0;
    "~^freelancer:" 1;
}
# Freelancer ruft den Editor-Link auf (Lesezeichen, „Neu anmelden") → auf seine Seite statt 403
map "$remote_user:$uri" $freelancer_umleiten {
    default 0;
    "freelancer:/layout-editor.html" 1;
}
map $remote_user $pm_startseite {
    default    /layout-editor.html;
    freelancer /amazon-bereich/start.html;
}

# Abmelden (Einstellungen → Anmeldung): Basic Auth hat kein echtes Abmelden, Safari behält die
# Zugangsdaten und schickt sie nach einem 401 sofort noch einmal (aus dem Schlüsselbund). Die Seite
# setzt deshalb das Cookie pm_abgemeldet=<benutzer> (5 min). Solange es zum angemeldeten Benutzer
# passt, antwortet nginx mit 401 + Abmelde-Seite — so lange, bis ein ANDERER Benutzer eingetragen
# wird; dessen erste Antwort löscht das Cookie. „Abbrechen" auf der Abmelde-Seite löscht es auch.
map "$cookie_pm_abgemeldet:$remote_user" $pm_abmelden {
    default 0;
    "~^([a-z0-9_-]+):\1$" 1;
}
map "$cookie_pm_abgemeldet:$remote_user" $pm_abmelde_cookie_weg {
    default "";
    "~^([a-z0-9_-]+):\1$" "";
    "~^[a-z0-9_-]+:[a-z0-9_-]+$" "pm_abgemeldet=; Path=/; Max-Age=0; Secure; SameSite=Lax";
}

server {
    listen 80;
    server_name laser.printomation.de;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name laser.printomation.de;

    ssl_certificate /etc/letsencrypt/live/laser.printomation.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/laser.printomation.de/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    auth_basic "Printomation";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Export-Uploads aus dem Editor (POST /export-upload): eine DXF ist regelmaessig
    # 1-10 MB gross. Ohne diese Zeile galt nginx' Vorgabe von 1 MB und alles darueber
    # kam mit 413 zurueck, ohne je den Node-Prozess zu erreichen. Fiel lange nicht auf,
    # weil der naechtliche Auto-Export ueber localhost:3002 laeuft und nginx umgeht.
    client_max_body_size 64m;

    if ($zuschauer_gesperrt) { return 403; }
    if ($freelancer_umleiten) { return 302 /amazon-bereich/start.html; }
    if ($freelancer_gesperrt) { return 403; }

    # Startseite gab es nie ("Cannot GET /") — direkt in den Editor
    # Startseite je Benutzer. Der allererste Aufruf kommt OHNE Anmeldung (der Browser schickt sie erst nach
    # einem 401) — dann zuerst nach der Anmeldung fragen, sonst ginge jeder in den Editor.
    location = / {
        if ($remote_user = "") {
            add_header WWW-Authenticate 'Basic realm="Printomation"' always;
            return 401;
        }
        return 302 $pm_startseite;
    }

    # Abmelde-Seite: ohne Anmeldung erreichbar (sie ist der Inhalt des Abmelde-401)
    location = /abgemeldet.html {
        auth_basic off;
        add_header WWW-Authenticate 'Basic realm="Printomation"' always;
        add_header Cache-Control "no-store" always;
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
    }

    # App-Link aus Amazon → Links (28.10.2026): Kunden aus Instagram/TikTok kommen ohne Anmeldung hierher.
    # Nur diese eine statische Seite (amazon-bereich/public/go.html); sie baut ausschließlich Amazon-Adressen.
    location = /go {
        auth_basic off;
        add_header X-Robots-Tag "noindex" always;
        add_header Cache-Control "no-store" always;
        proxy_pass http://127.0.0.1:3002/amazon-bereich/go.html;
        proxy_set_header Host $host;
    }

    location / {
        if ($pm_abmelden) {
            add_header WWW-Authenticate 'Basic realm="Printomation"' always;
            add_header Cache-Control "no-store" always;
            error_page 401 /abgemeldet.html;
            return 401;
        }
        # Ein anderer Benutzer hat sich angemeldet → Abmelde-Cookie weg (leer = kein Kopf)
        add_header Set-Cookie $pm_abmelde_cookie_weg always;
        # 127.0.0.1 statt localhost: Node lauscht seit 02.10.2026 nur noch auf IPv4-Loopback
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}