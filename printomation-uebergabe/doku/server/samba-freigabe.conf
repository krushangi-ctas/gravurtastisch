[Printomation]
   # Werkstatt-Freigabe: Bestellordner, Kundenfotos und Export-Ordner.
   # ANMELDUNG PFLICHT (guest ok = no + valid users). Vorher stand die Freigabe mit
   # guest ok = yes offen, und Port 445 haengt ohne Firewall am Internet.
   path = /var/www/printomation/printomation/src/public
   browseable = yes
   read only = no
   guest ok = no
   valid users = gravur
   # force user = root ist Absicht und noetig: den Baum schreibt der Node-Dienst als
   # root (public/<Tag>/, exports/). Ohne das koennte 'gravur' in den root-eigenen
   # Ordnern weder loeschen noch umbenennen. Wer sich anmeldet, arbeitet also als root
   # — deshalb ist das Passwort die einzige Grenze und gehoert entsprechend gewaehlt.
   force user = root
   create mask = 0664
   directory mask = 0775
