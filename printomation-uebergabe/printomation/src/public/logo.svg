<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 50" fill="none" role="img" aria-label="Printomation">
  <defs>
    <linearGradient id="logo-border-grad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0032ab"/>
      <stop offset="0.5" stop-color="#2032b5"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="logo-bg-grad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#002888"/>
      <stop offset="1" stop-color="#001858"/>
    </linearGradient>
    <linearGradient id="logo-p-grad" x1="14" y1="6" x2="38" y2="42" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#e0f2fe"/>
      <stop offset="1" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="logo-text-grad" x1="110" y1="0" x2="210" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563eb"/>
      <stop offset="0.5" stop-color="#4f6ef7"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- P Brand Mark Badge -->
  <g transform="translate(1, 1)">
    <rect width="48" height="48" rx="14" fill="url(#logo-border-grad)"/>
    <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#logo-bg-grad)"/>
    <circle cx="38" cy="10" r="5" fill="#38bdf8" opacity="0.6"/>
    <!-- Clean Letter P -->
    <path
      fill-rule="evenodd"
      clip-rule="evenodd"
      d="M14 8C14 6.9 14.9 6 16 6H27C33.08 6 38 10.92 38 17C38 23.08 33.08 28 27 28H20V40C20 41.1 19.1 42 18 42H16C14.9 42 14 41.1 14 40V8ZM20 12V22H27C29.76 22 32 19.76 32 17C32 14.24 29.76 12 27 12H20Z"
      fill="url(#logo-p-grad)"
    />
  </g>

  <!-- Brand Typography -->
  <text x="64" y="34" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" letter-spacing="-0.03em" fill="#0f172a">Print<tspan fill="url(#logo-text-grad)">omation</tspan></text>
</svg>
